<!doctype html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="/" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Sistem Penjadwalan & Realisasi Pemeliharaan (PlanKP)" />
    <meta name="theme-color" content="#285AC8" />

    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PlanKP" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>PlanKP</title>
    <link rel="manifest" href="manifest.json" />

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        touch-action: pan-x pan-y;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        background-color: #F8FAFC;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      /* Splash screen loader PWA */
      #pwa-loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #F8FAFC;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      #pwa-loading.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .pwa-spinner {
        width: 44px;
        height: 44px;
        border: 4px solid #E2E8F0;
        border-top: 4px solid #285AC8;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      .pwa-text {
        margin-top: 16px;
        font-size: 15px;
        font-weight: 700;
        color: #1E293B;
        letter-spacing: -0.2px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="pwa-loading">
      <div class="pwa-spinner"></div>
      <div class="pwa-text">Memuat PlanKP...</div>
    </div>

    <script>
      // Hilangkan splash loader setelah engine Flutter siap
      window.addEventListener('flutter-first-frame', function () {
        var loader = document.getElementById('pwa-loading');
        if (loader) {
          loader.classList.add('fade-out');
          setTimeout(function () {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          }, 350);
        }
      });

      // Force hard reload: Dipanggil saat user menekan tombol "Muat Ulang Sekarang"
      window.forceHardReload = async function () {
        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(
              registrations.map(function (r) {
                return r.unregister();
              }),
            );
          }
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(
              keys.map(function (k) {
                return caches.delete(k);
              }),
            );
          }
        } catch (e) {
          console.warn('Gagal membersihkan cache/service worker:', e);
        }

        // Muat ulang dengan query parameter cache-buster
        try {
          const url = new URL(window.location.href);
          url.searchParams.set('_v', Date.now().toString());
          window.location.href = url.toString();
          setTimeout(function () {
            window.location.reload();
          }, 100);
        } catch (_) {
          window.location.reload();
        }
      };
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
